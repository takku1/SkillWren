[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "skillwren"
version = "0.8.0"
description = "Check agent-skill procedures and enforce them at runtime: static validation of logic blocks and order rules, a trusted-host guard controller, an isolated sandbox observer, and an evidence ledger."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "takku1" }]
keywords = ["agents", "skills", "validation", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
skillwren = "skillwren.cli:main"

[project.optional-dependencies]
tokens = ["tiktoken>=0.7"]

[tool.setuptools.packages.find]
where = ["src"]
