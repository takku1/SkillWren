[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "skillwren"
version = "0.5.0"
description = "Logic-first skills: contract headers plus a closed control vocabulary, with a stdlib-only static validator."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "takku1" }]
keywords = ["agents", "skills", "validation", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
skillwren = "skillwren.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
