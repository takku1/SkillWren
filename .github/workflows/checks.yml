name: checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
        # setup-python ships no 3.9 build for Ubuntu 26.04 (ubuntu-latest);
        # keep the 3.9 compatibility lane on the older supported runner.
        exclude:
          - os: ubuntu-latest
            python: '3.9'
        include:
          - os: ubuntu-24.04
            python: '3.9'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -q
      - run: python tests/mutation_sweep.py
      - run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Install wheel and smoke test outside checkout
        shell: bash
        run: |
          python -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          python -c "import skillwren; from skillwren.guard import Controller; from skillwren.cli import COMMANDS; assert 'guard' in COMMANDS"
          skillwren ledger --help
          skillwren guard --help

